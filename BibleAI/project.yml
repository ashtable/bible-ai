name: BibleAI

options:
  bundleIdPrefix: com.retryai
  deploymentTarget:
    # iOS 27.0 — owner-chosen deployment target of record (single source of truth).
    # FoundationModels (AFM) shipped in iOS 26, but this app targets iOS 27.
    iOS: "27.0"
  developmentLanguage: en
  # Generate a scheme per target so `xcodebuild -scheme BibleAI` works out of the box.
  createIntermediateGroups: true

packages:
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion
    from: "1.1.0"

settings:
  base:
    SWIFT_VERSION: "6.0"          # Swift 6 language mode
    # iOS 27.0 — owner-chosen deployment target of record (single source of truth).
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES   # let Xcode synthesize Info.plist (no hand-maintained plist)
    # Code-signing team — folded in from manual pbxproj edits so `xcodegen generate`
    # no longer drops it (was applied out-of-band in commits 97a9522 / 0f8187f).
    DEVELOPMENT_TEAM: P9N5DTWDQ5
    # Generate Swift symbols for String Catalogs (matches prior project-level setting).
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  BibleAI:
    type: application
    platform: iOS
    sources:
      - path: BibleAI
    dependencies:
      - package: StableDiffusion
        product: StableDiffusion
    info:
      path: BibleAI/Info.plist        # synthesized via GENERATE_INFOPLIST_FILE; path kept for explicit keys
      properties:
        UILaunchScreen: {}
        # Register bundled custom fonts. XcodeGen copies .ttf resources to the
        # flat bundle root, so bare filenames resolve at runtime. Families:
        # "Nunito Sans" (UI body/headings) and "Caveat" (display accents).
        UIAppFonts:
          - NunitoSans-Regular.ttf
          - NunitoSans-SemiBold.ttf
          - NunitoSans-Bold.ttf
          - Caveat-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retryai.bibleai
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  BibleAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BibleAITests
    dependencies:
      - target: BibleAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retryai.bibleai.tests
        # Host the tests in the app so @testable import BibleAI resolves.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BibleAI.app/BibleAI"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  BibleAI:
    build:
      targets:
        BibleAI: all
        BibleAITests: [test]
    test:
      targets:
        - BibleAITests
      gatherCoverageData: false
