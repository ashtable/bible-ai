name: BibleAI

options:
  bundleIdPrefix: com.retryai
  deploymentTarget:
    # iOS 26.0 minimum — FoundationModels (AFM) shipped in iOS 26; building against the iOS 27 SDK.
    iOS: "26.0"
  developmentLanguage: en
  # Generate a scheme per target so `xcodebuild -scheme BibleAI` works out of the box.
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"          # Swift 6 language mode
    # iOS 26.0 minimum — FoundationModels (AFM) shipped in iOS 26; building against the iOS 27 SDK.
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES   # let Xcode synthesize Info.plist (no hand-maintained plist)

targets:
  BibleAI:
    type: application
    platform: iOS
    sources:
      - path: BibleAI
    info:
      path: BibleAI/Info.plist        # synthesized via GENERATE_INFOPLIST_FILE; path kept for explicit keys
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retryai.bibleai
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  BibleAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BibleAITests
    dependencies:
      - target: BibleAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retryai.bibleai.tests
        # Host the tests in the app so @testable import BibleAI resolves.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BibleAI.app/BibleAI"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  BibleAI:
    build:
      targets:
        BibleAI: all
        BibleAITests: [test]
    test:
      targets:
        - BibleAITests
      gatherCoverageData: false
